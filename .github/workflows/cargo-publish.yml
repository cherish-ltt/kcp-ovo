name: Publish to crates.io

# 触发：
#   workflow_call     —— 由 Release 工作流在 Release 创建成功后调用，
#                        保证 ci 校验 → Release → cargo publish 的顺序
#   workflow_dispatch —— 发布失败后手动重试，无需重新打标签
#
# 为什么用 workflow_call 而不是事件串接：
#   crates.io 的可信发布只接受 push / release / workflow_dispatch 事件，
#   明确拒绝 workflow_run；而 Release 由 GITHUB_TOKEN 创建时不会触发
#   release: published 事件。workflow_call 与调用方共享同一次 push 事件，
#   发布动作仍归属本文件，满足可信发布对工作流文件与环境的要求。
on:
  workflow_call:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    # 可选但强烈推荐，需要与你在crates.io上设置的Environment名称完全一致
    environment: release

    permissions:
      id-token: write  # 必须：用于请求OIDC令牌
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
