name: Publish to crates.io

# 触发：GitHub Release 发布后（Release 工作流已先完成 ci 校验并成功创建 Release）
# 行为：检出该 Release 对应标签的提交并发布到 crates.io，保证发布顺序为
#       ci → release → cargo publish。
#
# 注意：crates.io 的可信发布不接受 workflow_run 触发，只支持 push / release /
#       workflow_dispatch，因此这里用 release: published 承接上游。
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    # 可选但强烈推荐，需要与你在crates.io上设置的Environment名称完全一致
    environment: release

    permissions:
      id-token: write  # 必须：用于请求OIDC令牌
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
